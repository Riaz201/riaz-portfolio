<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <p>My academic work</p>
      <h1>Study Task Manager</h1>
    </header>

    <form id="task-form">
      <label for="task-name">Task name</label>
      <div class="input-row">
        <input id="task-name" type="text" maxlength="80" placeholder="e.g. Complete PDC assignment" required>
        <button type="submit">Add task</button>
      </div>
    </form>

    <section aria-labelledby="task-heading">
      <div class="list-heading">
        <h2 id="task-heading">Tasks</h2>
        <span id="task-count">0 tasks</span>
      </div>
      <ul id="task-list"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
